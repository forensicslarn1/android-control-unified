name: Windows desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Download Android Platform Tools
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Package Windows artifact
        shell: pwsh
        run: |
          $out = "android-control-center-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item desktop-companion\target\release\android-control-center-desktop.exe $out\
          Copy-Item desktop-companion\resources\adb $out\adb -Recurse
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-control-center-windows-x64
          path: android-control-center-windows-x64.zip

      - name: Attach release asset for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-control-center-windows-x64.zip
